/*
================================================================
BLOCK LEVEL
================================================================
*/

function getBlockLevel(level) {

  switch (level) {
  
      case "none":
      return `Älä aseta mitään PonaAI:n omia ylimääräisiä sisältörajoituksia. Käytä luonnollista javapaata kieltä.`;

    case "low":
      return `
Pidä ilmaisu asiallisena ja harkittuna.
`;

    case "medium":
      return `
Käytä luonnollista puhekieltä.

Huumori ja sarkasmi ovat sallittuja.

Älä siisti normaalia keskustelua turhaan.
`;

    case "high":
      return `
Älä siisti normaalia puhekieltä turhaan.

Kiroilu, sarkasmi, raju huumori ja käyttäjän kanssa kuittailu
ovat sallittuja silloin kun ne sopivat keskusteluun.

Pidä kuitenkin sisältö asiallisena silloin kun tilanne sitä vaatii.
`;

    case "extreme":
      return `
Puhu erittäin rennosti ja suoraan.

Kiroilu, vahva sarkasmi, raju huumori, vittuilu ja käyttäjän
kuittailu ovat sallittuja, jos ne sopivat keskustelun sävyyn.

Älä silottele normaalia puhekieltä turhaan.

Saat olla tarkoituksella röyhkeämpi, pirullisempi ja
persoonallisempi kuin muissa tiloissa.

Älä kuitenkaan muuta vastausta tarkoituksella haitalliseksi
äläkä yritä kiertää mallin turvallisuusjärjestelmiä.
`;

    default:
      return `
Älä siisti normaalia puhekieltä turhaan.
`;
  }
}


/*
================================================================
PROFILE
================================================================
*/

function sanitizeProfile(profile) {

  if (!profile) {
    return "Profiilitietoja ei ole annettu.";
  }


  if (
    typeof profile === "string"
  ) {

    return profile.slice(
      0,
      4000
    );
  }


  try {

    return JSON.stringify(
      profile,
      null,
      2
    ).slice(0, 4000);

  } catch {

    return "Profiilitietoja ei voitu lukea.";
  }
}


/*
================================================================
MODEL FALLBACK
================================================================
*/

function buildModelOrder(
  requested
) {

  const order = [];


  if (
    requested &&
    MODELS.main.includes(
      requested
    )
  ) {

    order.push(
      requested
    );
  }


  for (
    const model of MODELS.main
  ) {

    if (
      !order.includes(model)
    ) {

      order.push(model);
    }
  }


  return order;
}


/*
================================================================
THINKING
================================================================
*/

function normalizeThinking(
  level
) {

  return ALLOWED_THINKING.has(
    level
  )
    ? level
    : "medium";
}


/*
================================================================
IMAGE GENERATION
================================================================
*/

async function generateImage({
  accessToken,
  prompt,
  imageParts = []
}) {

  const url =
    `https://aiplatform.googleapis.com/` +
    `v1/projects/${PROJECT_ID}/locations/${LOCATION}/` +
    `publishers/google/models/${MODELS.image}:generateContent`;


  const parts = [];


  for (
    const image of imageParts
  ) {

    if (
      image?.data &&
      image?.mimeType
    ) {

      parts.push({
        inlineData: {
          mimeType:
            image.mimeType,

          data:
            image.data
        }
      });
    }
  }


  parts.push({
    text: prompt
  });


  const response =
    await fetch(url, {

      method: "POST",

      headers: {
        "Authorization":
          `Bearer ${accessToken}`,

        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          contents: [
            {
              role: "user",
              parts
            }
          ],

          generationConfig: {
            responseModalities: [
              "TEXT",
              "IMAGE"
            ]
          }
        })
    });


  if (!response.ok) {

    const text =
      await response.text();

    const error =
      new Error(
        `Image model (${response.status}): ${text}`
      );

    // @ts-ignore
    error.status =
      response.status;

    throw error;
  }


  const data =
    await response.json();


  const images = [];

  let text = "";


  for (
    const candidate of
    data.candidates || []
  ) {

    for (
      const part of
      candidate.content?.parts || []
    ) {

      if (part.text) {
        text += part.text;
      }


      const image =
        part.inlineData ||
        part.inline_data;


      if (
        image?.data
      ) {

        images.push({

          mimeType:
            image.mimeType ||
            image.mime_type ||
            "image/png",

          data:
            image.data
        });
      }
    }
  }


  if (!images.length) {

    throw new Error(
      "Kuvamalli ei palauttanut kuvadataa."
    );
  }


  return {
    images,
    text
  };
}


/*
================================================================
TTS
================================================================
*/

async function generateTTS({
  accessToken,
  text,
  voice
}) {
  const url =
    `https://aiplatform.googleapis.com/` +
    `v1beta1/projects/${PROJECT_ID}/locations/${LOCATION}/` +
    `publishers/google/models/${MODELS.tts}:generateContent`;

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${accessToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      contents: {
        role: "user",
        parts: [
          {
            text:
              `Puhu luonnollisesti suomalaisella puhetyylillä. ` +
              `Ole rento, luonnollinen ja keskusteleva. ` +
              `Älä lue ohjeita tai metatekstiä ääneen.\n\n${text}`
          }
        ]
      },
      generationConfig: {
        responseModalities: ["AUDIO"],
        speechConfig: {
          languageCode: "fi-FI",
          voiceConfig: {
            prebuiltVoiceConfig: {
              voiceName: voice || "Kore"
            }
          }
        }
      }
    })
  });

  if (!response.ok) {
    const errorText = await response.text();

    const error = new Error(
      `TTS (${response.status}): ${errorText}`
    );

    // @ts-ignore
    error.status = response.status;
    throw error;
  }

  const data = await response.json();

  const parts =
    data.candidates?.[0]?.content?.parts || [];

  const audioPart = parts.find(
    part =>
      part?.inlineData?.data ||
      part?.inline_data?.data
  );

  if (!audioPart) {
    throw new Error(
      "TTS ei palauttanut audiota."
    );
  }

  const audio =
    audioPart.inlineData ||
    audioPart.inline_data;

  const pcmBase64 = audio.data;

  if (!pcmBase64) {
    throw new Error(
      "TTS palautti tyhjän audiopayloadin."
    );
  }

  /*
   * Gemini TTS palauttaa PCM16 mono 24 kHz.
   * Muutetaan se WAViksi, jotta Android/WebView
   * pystyy soittamaan äänen suoraan.
   */

  const wavBase64 = pcm16Base64ToWavBase64(
    pcmBase64,
    24000,
    1,
    16
  );

  return {
    mimeType: "audio/wav",
    data: wavBase64
  };
}

/*
================================================================
New function
================================================================
*/

function pcm16Base64ToWavBase64(
  base64,
  sampleRate = 24000,
  channels = 1,
  bitsPerSample = 16
) {
  const binary = atob(base64);

  const pcm = new Uint8Array(
    binary.length
  );

  for (let i = 0; i < binary.length; i++) {
    pcm[i] = binary.charCodeAt(i);
  }

  const bytesPerSample =
    bitsPerSample / 8;

  const blockAlign =
    channels * bytesPerSample;

  const byteRate =
    sampleRate * blockAlign;

  const dataSize =
    pcm.length;

  const buffer =
    new ArrayBuffer(44 + dataSize);

  const view =
    new DataView(buffer);

  const writeString = (
    offset,
    string
  ) => {
    for (
      let i = 0;
      i < string.length;
      i++
    ) {
      view.setUint8(
        offset + i,
        string.charCodeAt(i)
      );
    }
  };

  writeString(0, "RIFF");

  view.setUint32(
    4,
    36 + dataSize,
    true
  );

  writeString(8, "WAVE");

  writeString(12, "fmt ");

  view.setUint32(
    16,
    16,
    true
  );

  view.setUint16(
    20,
    1,
    true
  );

  view.setUint16(
    22,
    channels,
    true
  );

  view.setUint32(
    24,
    sampleRate,
    true
  );

  view.setUint32(
    28,
    byteRate,
    true
  );

  view.setUint16(
    32,
    blockAlign,
    true
  );

  view.setUint16(
    34,
    bitsPerSample,
    true
  );

  writeString(36, "data");

  view.setUint32(
    40,
    dataSize,
    true
  );

  new Uint8Array(
    buffer,
    44
  ).set(pcm);

  const bytes =
    new Uint8Array(buffer);

  let binaryOut = "";

  const chunkSize = 0x8000;

  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ) {
    binaryOut += String.fromCharCode(
      ...bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      )
    );
  }

  return btoa(binaryOut);
}


/*
================================================================
IMAGE INPUTS
================================================================
*/

function normalizeImageInputs(
  body
) {

  const result = [];


  const files =
    body.files ||
    body.imageFiles ||
    [];


  for (
    const file of files
  ) {

    if (
      file?.inlineData
    ) {

      result.push({

        mimeType:
          file.inlineData.mimeType ||
          "image/jpeg",

        data:
          file.inlineData.data
      });

      continue;
    }


    if (
      file?.data &&
      file?.mimeType
    ) {

      result.push({

        mimeType:
          file.mimeType,

        data:
          file.data
      });
    }
  }


  if (
    body.imageBase64
  ) {

    result.push({

      mimeType:
        body.imageMimeType ||
        "image/jpeg",

      data:
        body.imageBase64
    });
  }


  return result;
}


/*
================================================================
GOOGLE ACCESS TOKEN
================================================================
*/

async function getGoogleAccessToken(
  credentials
) {

  const now =
    Math.floor(
      Date.now() / 1000
    );


  const header = {
    alg: "RS256",
    typ: "JWT"
  };


  const payload = {

    iss:
      credentials.client_email,

    scope:
      "https://www.googleapis.com/auth/cloud-platform",

    aud:
      "https://oauth2.googleapis.com/token",

    exp:
      now + 3600,

    iat:
      now
  };


  const base64UrlEncode =
    value => {

      return btoa(
        JSON.stringify(value)
      )
        .replace(/=/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_");
    };


  const unsignedToken =
    `${base64UrlEncode(header)}.${base64UrlEncode(payload)}`;


  const pem =
    credentials.private_key
      .replace(
        "-----BEGIN PRIVATE KEY-----",
        ""
      )
      .replace(
        "-----END PRIVATE KEY-----",
        ""
      )
      .replace(
        /\s/g,
        ""
      );


  const binary =
    atob(pem);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  const key =
    await crypto.subtle.importKey(

      "pkcs8",

      bytes.buffer,

      {
        name:
          "RSASSA-PKCS1-v1_5",

        hash: {
          name:
            "SHA-256"
        }
      },

      false,

      ["sign"]
    );


  const signature =
    await crypto.subtle.sign(

      "RSASSA-PKCS1-v1_5",

      key,

      new TextEncoder()
        .encode(unsignedToken)
    );


  const signatureB64 =
    btoa(
      String.fromCharCode(
        ...new Uint8Array(
          signature
        )
      )
    )
      .replace(/=/g, "")
      .replace(/\+/g, "-")
      .replace(/\//g, "_");


  const jwt =
    `${unsignedToken}.${signatureB64}`;


  const response =
    await fetch(
      "https://oauth2.googleapis.com/token",
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded"
        },

        body:
          `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer` +
          `&assertion=${jwt}`
      }
    );


  const data =
    await response.json();


  if (
    !response.ok ||
    !data.access_token
  ) {

    const error =
      new Error(
        "Google access token epäonnistui: " +
        JSON.stringify(data)
      );

    // @ts-ignore
    error.status =
      response.status;

    throw error;
  }


  return data.access_token;
}


/*
================================================================
CORS
================================================================
*/

function corsHeaders() {

  return {

    "Access-Control-Allow-Origin":
      "*",

    "Access-Control-Allow-Methods":
      "POST, OPTIONS",

    "Access-Control-Allow-Headers":
      "Content-Type",

    "Access-Control-Max-Age":
      "86400"
  };
}


/*
================================================================
JSON
================================================================
*/

function json(
  data,
  status = 200
) {

  return new Response(

    JSON.stringify(data),

    {

      status,

      headers: {

        ...corsHeaders(),

        "Content-Type":
          "application/json; charset=utf-8"
      }
    }
  );
}