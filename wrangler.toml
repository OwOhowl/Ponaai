export default {
  // @ts-ignore
  // @ts-ignore
  async fetch(request, env, ctx) {

    if (request.method === "OPTIONS") {
      return new Response(null, {
        headers: corsHeaders()
      });
    }

    if (request.method !== "POST") {
      return json(
        {
          error: {
            message: "Method not allowed"
          }
        },
        405
      );
    }

    try {

      const body = await request.json();

      const accessToken =
        await getGoogleAccessToken(credentials);

      const task =
        body.task || "chat";


      /*
      ============================================================
      CHAT + VISION
      ============================================================
      */

      if (
        task === "chat" ||
        task === "vision"
      ) {

        const requestedModel =
          body.model || MODELS.main[0];

        const modelOrder =
          buildModelOrder(requestedModel);

        const contents =
          buildContents(body);

        const systemInstruction =
          buildSystemInstruction(body);

        const thinkingLevel =
          normalizeThinking(
            body.thinkingLevel
          );

        let lastError = null;

        for (const model of modelOrder) {

          try {

            return await generateStream({
              accessToken,
              model,
              contents,
              systemInstruction,
              thinkingLevel
            });

          } catch (error) {

            lastError = error;

            /*
            Vain tilapäinen kuorma-/palvelinvirhe
            saa vaihtaa seuraavaan malliin.

            400 / 401 / 403 / 404
            pysäytetään heti.
            */

            if (
              !RETRYABLE_STATUS.has(
                error?.status
              )
            ) {
              break;
            }
          }
        }

        throw (
          lastError ||
          new Error(
            "Gemini-pyyntö epäonnistui."
          )
        );
      }


      /*
      ============================================================
      IMAGE GENERATION
      ============================================================
      */

      if (task === "image") {

        const prompt =
          typeof body.prompt === "string"
            ? body.prompt
            : "Generoi kuva käyttäjän ohjeen perusteella.";

        const imageParts =
          normalizeImageInputs(body);

        const result =
          await generateImage({
            accessToken,
            prompt,
            imageParts
          });

        return json({
          ok: true,
          images: result.images,
          text: result.text || ""
        });
      }


      /*
      ============================================================
      TTS
      ============================================================
      */

      if (task === "tts") {

        const text =
          typeof body.text === "string"
            ? body.text.trim()
            : "";

        if (!text) {
          throw new Error(
            "TTS: teksti puuttuu."
          );
        }

        const result =
          await generateTTS({
            accessToken,
            text,
            voice:
              body.voice || "Kore"
          });

        return json({
          ok: true,
          mimeType: result.mimeType,
          data: result.data
        });
      }


      /*
      ============================================================
      LIVE INFO
      ============================================================
      */

      if (task === "live-info") {

        return json({
          ok: true,
          model: MODELS.live,
          message:
            "Gemini Live -malli on määritetty PonaAI:lle."
        });
      }


      throw new Error(
        `Tuntematon task: ${task}`
      );

    } catch (error) {

      const status =
        Number(error?.status);

      return json(
        {
          error: {
            message:
              error?.message ||
              "Tuntematon Worker-virhe",
            status:
              status || 500
          }
        },
        status >= 400 && status < 600
          ? status
          : 500
      );
    }
  }
};


/*
================================================================
CHAT / VISION STREAM
================================================================
*/

async function generateStream({
  accessToken,
  model,
  contents,
  systemInstruction,
  thinkingLevel
}) {
  const url =
    `https://aiplatform.googleapis.com/v1/projects/${PROJECT_ID}` +
    `/locations/${LOCATION}/publishers/google/models/${model}` +
    `:streamGenerateContent?alt=sse`;

  const body = {
    contents,
    systemInstruction
  };

  if (thinkingLevel) {
    body.generationConfig = {
      thinkingConfig: {
        thinkingLevel: thinkingLevel.toUpperCase()
      }
    };
  }

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${accessToken}`,
      "Content-Type": "application/json",
      "Accept": "text/event-stream"
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const text = await response.text();

    const error = new Error(
      `Vertex ${model} (${response.status}): ${text}`
    );

    // @ts-ignore
    error.status = response.status;
    throw error;
  }

  return new Response(response.body, {
    status: 200,
    headers: {
      ...corsHeaders(),
      "Content-Type": "text/event-stream; charset=utf-8",
      "Cache-Control": "no-cache, no-transform",
      "Connection": "keep-alive"
    }
  });
}


/*
================================================================
CONTENTS
================================================================
*/

function buildContents(body) {
  const prompt = body.prompt;

  // ============================================================
  // VISION / KUVA
  // ============================================================
  if (body.imageBase64) {
    const parts = [];

    parts.push({
      inlineData: {
        mimeType:
          body.imageMimeType ||
          "image/jpeg",
        data:
          body.imageBase64
      }
    });

    if (typeof prompt === "string" && prompt.trim()) {
      parts.push({
        text: prompt
      });
    } else {
      parts.push({
        text: "Analysoi tämä kuva."
      });
    }

    return [
      {
        role: "user",
        parts
      }
    ];
  }

  // ============================================================
  // NORMAALI CHAT
  // ============================================================
  if (
    typeof prompt === "string"
  ) {
    return [
      {
        role: "user",
        parts: [
          {
            text: prompt
          }
        ]
      }
    ];
  }

  if (
    Array.isArray(prompt)
  ) {
    return [
      {
        role: "user",
        parts: prompt
      }
    ];
  }

  if (
    prompt &&
    typeof prompt === "object"
  ) {
    if (
      Array.isArray(
        prompt.contents
      )
    ) {
      return prompt.contents;
    }

    if (
      Array.isArray(
        prompt.parts
      )
    ) {
      return [
        {
          role: "user",
          parts: prompt.parts
        }
      ];
    }
  }

  return [
    {
      role: "user",
      parts: [
        {
          text:
            "Vastaa käyttäjälle."
        }
      ]
    }
  ];
}


/*
